<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسئلة الشائعة</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg: #f0f4ff;
            --card-bg: #ffffff;
            --text: #1e293b;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe, #a5b4fc);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: var(--shadow);
            padding: 30px;
            margin-top: 20px;
        }
        h1 {
            text-align: center;
            color: var(--primary-dark);
            font-size: 2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .qa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .qa-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .qa-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border-color: var(--primary);
        }
        .qa-card .question-text {
            font-weight: 700;
            color: var(--text);
            font-size: 1.1rem;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .qa-card .hint {
            font-size: 0.8rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .empty-message {
            text-align: center;
            color: #64748b;
            padding: 40px 20px;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-box {
            background: white;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            transform: translateY(30px) scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .modal-box.active {
            transform: translateY(0) scale(1);
        }
        .modal-question {
            font-size: 1.3rem;
            color: var(--primary-dark);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }
        .modal-answer {
            font-size: 1.1rem;
            color: #334155;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #f1f5f9;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover {
            background: #e2e8f0;
            transform: rotate(90deg);
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 الأسئلة الشائعة</h1>
        <div class="qa-grid" id="qaGrid">
            <div class="empty-message">جاري تحميل الأسئلة...</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-question" id="modalQuestion"></div>
            <div class="modal-answer" id="modalAnswer"></div>
            <div class="modal-actions">
                <button class="btn-primary" id="modalOk">حسناً</button>
            </div>
        </div>
    </div>

    <script>
        async function loadQuestions() {
            try {
                const response = await fetch('questions.json');
                if (!response.ok) throw new Error('File not found');
                const data = await response.json();
                renderQAGrid(data);
            } catch (error) {
                document.getElementById('qaGrid').innerHTML = '<div class="empty-message">تعذر تحميل الأسئلة. تأكد من وجود ملف questions.json.</div>';
            }
        }

        function renderQAGrid(qaData) {
            const grid = document.getElementById('qaGrid');
            grid.innerHTML = '';
            if (!qaData || qaData.length === 0) {
                grid.innerHTML = '<div class="empty-message">لا توجد أسئلة متاحة حالياً.</div>';
                return;
            }
            qaData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'qa-card';
                card.innerHTML = `
                    <div class="question-text">${item.question}</div>
                    <div class="hint">👆 اضغط لعرض الجواب</div>
                `;
                card.addEventListener('click', () => openModal(item.question, item.answer));
                grid.appendChild(card);
            });
        }

        function openModal(question, answer) {
            document.getElementById('modalQuestion').textContent = question;
            document.getElementById('modalAnswer').textContent = answer;
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('modalBox').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('modalBox').classList.remove('active');
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOk').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        loadQuestions();
    </script>
</body>
</html>
